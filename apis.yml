aid: brightedge-technologies
name: BrightEdge Technologies
description: >-
  BrightEdge is an enterprise SEO and content performance marketing platform,
  founded in 2007 and headquartered in Foster City, California. Its S3 platform
  uses AI and machine learning (the BrightEdge "Data Cube" and Copilot/Autopilot
  engines) to help brands research keywords, optimize content, analyze
  competitors, audit sites, track SERP features and AI answers, and measure
  organic search performance against revenue. The BrightEdge Platform API (v5.0)
  is a REST interface that exposes accounts, keywords, keyword groups,
  competitors, domains, backlinks, page crawl and cache, Core Web Vitals, market
  insights, SERP and People-Also-Ask data, AI Catalyst share-of-answer metrics,
  bulk export jobs, and user administration, letting enterprise customers pull
  BrightEdge insights into platforms such as Salesforce Marketing Cloud, Domo,
  and Marketo. BrightEdge serves 1,700+ brands including dozens of the Fortune 100.
